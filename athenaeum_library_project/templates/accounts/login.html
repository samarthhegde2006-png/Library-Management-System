{% extends 'base.html' %}
{% block content %}<main style="padding:76px 0;"><div class="container" style="max-width:440px;"><div class="glass-card" style="padding:34px;"><span class="eyebrow-pill">READER SIGN IN</span><h1 style="margin-bottom:14px;">Welcome Back</h1><form method="post" style="display:flex; flex-direction:column; gap:12px;">{% csrf_token %}<div><label class="form-label">Username or Email</label>{{ form.identifier }}</div><div><label class="form-label">Password</label><div style="position:relative;">{{ form.password }}<button type="button" onclick="togglePwd('login-password',this)" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;">Show</button></div></div><button type="submit" class="pill-primary-btn" style="padding:13px;">Sign In</button></form></div></div></main><script>document.querySelectorAll('form input').forEach(i=>{if(i.type!=='checkbox'&&i.type!=='hidden')i.classList.add('aether-input');});</script>{% endblock %}
